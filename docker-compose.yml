services:
  server:
    build:
      context: .
      dockerfile: DOCKERFILE
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: npm run start
    environment:
      - NODE_ENV=production
      - BOT_SERVICE_URL=http://bot:8000
    depends_on:
      - bot

  bot:
    build:
      context: bot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - bot-model:/app/model

volumes:
  bot-model:
