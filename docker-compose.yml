services:
  server:
    image: ghcr.io/filip082/dixit-ai:latest
    build:
      context: .
      dockerfile: DOCKERFILE
    ports:
      - "3001:3000"
    env_file:
      - .env
    command: npm run start
    environment:
      - NODE_ENV=production
      - BOT_SERVICE_URL=http://bot:8000
    depends_on:
      - bot

  bot:
    image: ghcr.io/filip082/dixit-ai-bot:latest
    build:
      context: bot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
